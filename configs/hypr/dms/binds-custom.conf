# === 自定义快捷键配置（保留原有习惯）===
# 此文件覆盖 DMS 默认配置中的部分快捷键

# === 窗口规则 ===

# fly_is_kitty 终端浮动窗口
windowrule = float on, match:class ^(fly_is_kitty)$
windowrule = size 80% 60%, match:class ^(fly_is_kitty)$
windowrule = center on, match:class ^(fly_is_kitty)$

# === 保留的原配置快捷键 ===

# 截图（satty）
bind = SUPER, P, exec, grim -g "$(slurp)" - | satty --filename -

# OCR 翻译（Pot）
bind = SUPER, O, exec, grim -g "$(slurp)" ~/.cache/com.pot-app.desktop/pot_screenshot_cut.png && curl "127.0.0.1:60828/ocr_translate?screenshot=false"

# 文件管理器
bind = SUPER, E, exec, uwsm app -- nautilus --new-window

# 终端（简化版，不依赖 omarchy）
bindd = SUPER, return, Terminal, exec, uwsm app -- $TERMINAL --class fly_is_kitty --title fly_is_kitty
bindd = ALT, return, Terminal, exec, uwsm app -- $TERMINAL

# 切换浮动
bind = SUPER, S, togglefloating

# 切换组
bind = SUPER, G, togglegroup

# 固定窗口（从 SUPER + N 改为 ALT + N）
bind = ALT, N, pin

# 锁屏（从 SUPER + ALT + L 改为 SUPER + L）
bind = SUPER, L, exec, dms ipc call lock lock

# 亮度控制（使用 brightnessctl）
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# === 工作区快捷移动（Alt + 数字键）===
# 使用 Alt + 1-9 快速移动窗口到对应工作区
bind = ALT, 1, movetoworkspace, 1
bind = ALT, 2, movetoworkspace, 2
bind = ALT, 3, movetoworkspace, 3
bind = ALT, 4, movetoworkspace, 4
bind = ALT, 5, movetoworkspace, 5
bind = ALT, 6, movetoworkspace, 6
bind = ALT, 7, movetoworkspace, 7
bind = ALT, 8, movetoworkspace, 8
bind = ALT, 9, movetoworkspace, 9
