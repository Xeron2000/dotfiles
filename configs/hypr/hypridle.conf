general {
    lock_cmd = dms ipc call lock lock          # 锁屏命令
    before_sleep_cmd = dms ipc call lock lock  # 睡眠前锁屏
    after_sleep_cmd = hyprctl dispatch dpms on # 唤醒后开启屏幕
    ignore_dbus_inhibit = false                # 尊重应用的禁止空闲请求（如播放视频）
}

# 监听器 1：5分钟后锁屏
listener {
    timeout = 300                              # 5分钟（300秒）
    on-timeout = dms ipc call lock lock        # 执行锁屏
}

# 监听器 2：10分钟后熄屏
listener {
    timeout = 600                              # 10分钟（600秒）
    on-timeout = hyprctl dispatch dpms off     # 关闭屏幕
    on-resume = hyprctl dispatch dpms on       # 恢复时开启屏幕
}

# 监听器 3：30分钟后挂起（可选，如果不需要可以注释掉）
